name: colmena

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

# Prevent simultaneous deployments
concurrency:
  group: ${{ github.workflow }}

jobs:
  colmena:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.READ_NIXOS_SECRETS_GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://attic.osipol.uk/cache
            extra-trusted-public-keys = cache:C3spwmruXebNeOwAnYy98JGgTOnos586oMVmkYn/RYg=

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.COLMENA_SSH_PRIVATE_KEY }}

      - name: Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Cache Nix store and cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: colmena-${{ runner.os }}-hashFiles('**/flake.lock') }}-${{ hashFiles('**/*.nix') }}
          restore-prefixes-first-match: |
            colmena-${{ runner.os }}-hashFiles('**/flake.lock') }}-
            colmena-${{ runner.os }}-
          paths: |
            ~/.cache/nix
          gc-max-store-size-linux: 2G

      - name: Apply with Colmena
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          nix run nixpkgs#attic-client login local https://attic.osipol.uk "$ATTIC_TOKEN"

          # Upload new paths to cache while building
          nix run nixpkgs#attic-client watch-store cache &
          watch_store_pid=$!
          trap 'kill "$watch_store_pid" 2>/dev/null || true; wait "$watch_store_pid" 2>/dev/null || true' EXIT

          nix run .#colmena -- apply --no-build-on-target --keep-result --on @cloud

          # Push remaining paths to cache
          nix run nixpkgs#attic-client push cache $(nix path-info .#colmena) .gcroots/*

