name: Build & Push to Binary Cache
description: Build all NixOS configurations & populate binary cache

on:
  pull_request:

jobs:
  build:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'automated') &&
      contains(github.event.pull_request.labels.*.name, 'flake-update')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "able-archer"
            attr: ".#nixosConfigurations.able-archer.config.system.build.toplevel"
            runner: ubuntu-24.04-arm
          - target: "steadfast-dart"
            attr: ".#nixosConfigurations.steadfast-dart.config.system.build.toplevel"
            runner: ubuntu-latest
          - target: "steadfast-defender"
            attr: ".#nixosConfigurations.steadfast-defender.config.system.build.toplevel"
            runner: ubuntu-latest
          - target: "iso-aarch64"
            attr: ".#packages.aarch64-linux.iso-system"
            runner: ubuntu-24.04-arm
          - target: "iso-x86_64"
            attr: ".#packages.x86_64-linux.iso-system"
            runner: ubuntu-latest
          - target: "mirage-red"
            attr: ".#nixosConfigurations.mirage-red.config.system.build.toplevel"
            runner: ubuntu-latest
          - target: "mirage-blue"
            attr: ".#nixosConfigurations.mirage-blue.config.system.build.toplevel"
            runner: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.READ_NIXOS_SECRETS_GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://attic.osipol.uk/cache
            extra-trusted-public-keys = cache:C3spwmruXebNeOwAnYy98JGgTOnos586oMVmkYn/RYg=

      - name: Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure Attic cache
        uses: ./.github/actions/attic-cache
        with:
          token: ${{ secrets.ATTIC_TOKEN }}

      - name: Build with Nix
        run: |
          nix build \
            ${{ matrix.attr }} \
            --print-build-logs \
            --no-link \
            --print-out-paths > .attic-out-paths.tmp
          mv .attic-out-paths.tmp .attic-out-paths
