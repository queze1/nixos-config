name: build
description: Build all NixOS configurations & populate binary cache

on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: "able-archer"
            attr: ".#nixosConfigurations.able-archer.config.system.build.toplevel"
            runner: ubuntu-24.04-arm
          - target: "steadfast-dart"
            attr: ".#nixosConfigurations.steadfast-dart.config.system.build.toplevel"
            runner: ubuntu-latest
          - target: "steadfast-defender"
            attr: ".#nixosConfigurations.steadfast-defender.config.system.build.toplevel"
            runner: ubuntu-latest
          - target: "iso-aarch64"
            attr: ".#packages.aarch64-linux.iso-system"
            runner: ubuntu-24.04-arm
          - target: "iso-x86_64"
            attr: ".#packages.x86_64-linux.iso-system"
            runner: ubuntu-latest
          - target: "mirage-white"
            attr: ".#nixosConfigurations.mirage-white.config.system.build.toplevel"
            runner: ubuntu-latest
          - target: "mirage-red"
            attr: ".#nixosConfigurations.mirage-red.config.system.build.toplevel"
            runner: ubuntu-latest
          - target: "mirage-blue"
            attr: ".#nixosConfigurations.mirage-blue.config.system.build.toplevel"
            runner: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
        with:
          github_access_token: ${{ secrets.READ_NIXOS_SECRETS_GITHUB_TOKEN }}
          nix_conf: experimental-features = nix-command flakes

      - name: Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Build with Nix
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          nix run nixpkgs#attic-client login local https://attic.osipol.uk "$ATTIC_TOKEN"
          nix run nixpkgs#attic-client use cache

          # Upload new paths to cache while building
          nix run nixpkgs#attic-client watch-store cache &
          watch_store_pid=$!
          trap 'kill "$watch_store_pid" 2>/dev/null || true; wait "$watch_store_pid" 2>/dev/null || true' EXIT

          nix build \
            ${{ matrix.attr }} \
            --print-build-logs \
            --no-link \
            --print-out-paths > out-paths

          # Push remaining paths
          nix run nixpkgs#attic-client push cache $(<out-paths)

