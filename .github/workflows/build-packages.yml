name: Build Packages
description: Build all custom packages & push to binary cache

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  find-packages:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.find-packages.outputs.package-names }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Find package names
        id: find-packages
        run: |
          packages=$(nix eval .#myPackages.x86_64-linux --apply builtins.attrNames --json | jq -c .)
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  build-packages:
    needs: find-packages
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.find-packages.outputs.packages) }}
        system:
          - x86_64-linux
          - aarch64-linux
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
        
    uses: ./.github/workflows/run-with-attic.yml
    with:
      runs-on: ubuntu-latest
      script: |
        echo "hi" 
    secrets:
      GITHUB_ACCESS_TOKEN: ${{ secrets.READ_NIXOS_SECRETS_GITHUB_TOKEN }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }} 



  build_packages_old:
    if: false
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        package:
          - filebrowser-quantum
          - tumblr-backup
          - creamlinux-installer
          - actions-languageserver
        system:
          - x86_64-linux
          - aarch64-linux
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.READ_NIXOS_SECRETS_GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://attic.osipol.uk/cache
            extra-trusted-public-keys = cache:C3spwmruXebNeOwAnYy98JGgTOnos586oMVmkYn/RYg=

      - name: Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure Attic cache
        uses: ./.github/actions/attic-cache
        with:
          token: ${{ secrets.ATTIC_TOKEN }}

      - name: Check Attic cache
        id: cache
        run: |
          out_path="$(nix eval --raw \
            ".#packages.${{ matrix.system }}.${{ matrix.package }}.outPath")"

          if nix path-info --store https://attic.osipol.uk/cache "$out_path" > /dev/null; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build with Nix
        if: steps.cache.outputs.hit != 'true'
        run: |
          nix build \
            ".#packages.${{ matrix.system }}.${{ matrix.package }}" \
            --print-build-logs \
            --no-link \
            --print-out-paths > .attic-out-paths

      - name: Upload to Attic cache
        if: >-
          steps.cache.outputs.hit != 'true'
        run: |
          nix run nixpkgs#attic-client push cache $(<.attic-out-paths)
