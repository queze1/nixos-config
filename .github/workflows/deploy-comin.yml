name: Deploy Comin
description: Builds hosts using comin and fast-forwards deployed branch

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  find-configurations:
    runs-on: ubuntu-latest
    outputs:
      configurations: ${{ steps.find-configurations.outputs.configurations }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.READ_NIXOS_SECRETS_GITHUB_TOKEN }}

      - name: Find configuration names and runners
        id: find-configurations
        run: |
          configurations=$(nix eval .#nixosConfigurations --apply "$(cat .github/workflows/deploy-comin-matrix.nix)" --json)
          echo "configurations=$configurations" >> "$GITHUB_OUTPUT"

  build-configurations:
    needs: find-configurations
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.find-configurations.outputs.configurations) }}

    uses: ./.github/workflows/build-with-attic.yml
    with:
      runs-on: ${{ matrix.runner }}
      target: ${{ matrix.attr }}
    secrets:
      GITHUB_ACCESS_TOKEN: ${{ secrets.READ_NIXOS_SECRETS_GITHUB_TOKEN }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }} 

  # Add to deployed branch if tests pass and the push was on main
  promote:
    needs: build-configurations
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fast-forward deployed branch
        run: |
          git push --force origin HEAD:refs/heads/deployed
