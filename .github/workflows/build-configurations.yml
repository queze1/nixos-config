name: Build Configurations
description: Build all NixOS configurations & push to binary cache

on:
  workflow_dispatch:
  pull_request:

jobs:
  build-configurations:
    # Only runs on a flake update
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'automated') &&
        contains(github.event.pull_request.labels.*.name, 'flake-update')
      )

    strategy:
      fail-fast: false
      matrix:
        include:
          - attr: ".#nixosConfigurations.able-archer.config.system.build.toplevel"
            runner: ubuntu-24.04-arm
          - attr: ".#nixosConfigurations.iron-hammer.config.system.build.toplevel"
            runner: ubuntu-latest
          - attr: ".#nixosConfigurations.steadfast-dart.config.system.build.toplevel"
            runner: ubuntu-latest
          - attr: ".#nixosConfigurations.steadfast-defender.config.system.build.toplevel"
            runner: ubuntu-latest
          - attr: ".#nixosConfigurations.mirage-red.config.system.build.toplevel"
            runner: ubuntu-latest
          - attr: ".#nixosConfigurations.mirage-blue.config.system.build.toplevel"
            runner: ubuntu-latest

    uses: ./.github/workflows/build-with-attic.yml
    with:
      runs-on: ${{ matrix.runner }}
      target: ${{ matrix.attr }}
    secrets:
      GITHUB_ACCESS_TOKEN: ${{ secrets.READ_NIXOS_SECRETS_GITHUB_TOKEN }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }} 

