name: nixbuild

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: "able-archer"
            attr: ".#nixosConfigurations.able-archer.config.system.build.toplevel"
          - target: "steadfast-dart"
            attr: ".#nixosConfigurations.steadfast-dart.config.system.build.toplevel"
          - target: "steadfast-defender"
            attr: ".#nixosConfigurations.steadfast-defender.config.system.build.toplevel"
          - target: "iso-aarch64"
            attr: ".#packages.aarch64-linux.iso-system"
          - target: "iso-x86_64"
            attr: ".#packages.x86_64-linux.iso-system"

    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
        with:
          github_access_token: ${{ secrets.READ_NIXOS_SECRETS_GITHUB_TOKEN }}
          nix_conf: experimental-features = nix-command flakes
          nix_on_tmpfs: true

      - name: Cache Nix store and cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: ${{ github.workflow }}-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/flake.lock') }}-${{ hashFiles('**/*.nix') }}
          restore-prefixes-first-match: |
            ${{ github.workflow }}-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/flake.lock') }}-
            ${{ github.workflow }}-${{ runner.os }}-${{ matrix.target }}-
            ${{ github.workflow }}-${{ runner.os }}-
          paths: |
            ~/.cache/nix
          gc-max-store-size-linux: 2G

      - uses: nixbuild/nixbuild-action@v25
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}

      - name: Build with nixbuild
        run: |
          nix build \
            ${{ matrix.attr }} \
            --print-build-logs \
            --eval-store auto \
            --store ssh-ng://eu.nixbuild.net \
            --builders "" \
            --no-link

  summary:
    name: "Summary"
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate nixbuild.net summary
        uses: nixbuild/nixbuild-action@v25
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}
          generate_summary_for: 'workflow'

  # Add to deployed branch if tests pass and the push was on main
  promote:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fast-forward deployed branch
        run: |
          git push --force origin HEAD:refs/heads/deployed
