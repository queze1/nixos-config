name: Build Packages
description: Build all custom packages & push to binary cache

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  build:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'automated') &&
      contains(github.event.pull_request.labels.*.name, 'flake-update') ||
      github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        package:
          - filebrowser-quantum
          - tumblr-backup
        system:
          - x86_64-linux
          - aarch64-linux
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.READ_NIXOS_SECRETS_GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://attic.osipol.uk/cache
            extra-trusted-public-keys = cache:C3spwmruXebNeOwAnYy98JGgTOnos586oMVmkYn/RYg=

      - name: Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure Attic cache
        uses: ./.github/actions/attic-cache
        with:
          token: ${{ secrets.ATTIC_TOKEN }}

      - name: Build with Nix
        run: |
          nix build \
            ".#packages.${{ matrix.system }}.${{ matrix.package }}" \
            --print-build-logs \
            --no-link \
            --print-out-paths > .attic-out-paths

      - name: Upload to Attic cache
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: |
          nix run nixpkgs#attic-client push cache $(<.attic-out-paths)
